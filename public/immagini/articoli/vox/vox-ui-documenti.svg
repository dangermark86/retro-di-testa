<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="t d"><title id="t">Schermata Documenti di VOX</title><desc id="d">Ricostruzione fedele dell'editor documenti locale di VOX</desc><rect width="1600" height="980" rx="36" fill="#0b0c11"/><path d="M305 0v980" stroke="#2b2d34"/><text x="50" y="80" fill="#9a9ba1" font-family="monospace" font-size="20" letter-spacing="5">RETRO DI TESTA</text><text x="50" y="180" fill="#fff" font-family="Arial" font-size="76" font-weight="800" letter-spacing="14">VOX</text><text x="50" y="230" fill="#ff5151" font-family="monospace" font-size="16" letter-spacing="3">PERSONAL INTELLIGENCE</text><g fill="#fff" font-family="Arial" font-size="20"><text x="65" y="360">Conversazione</text><text x="65" y="435">Cronologia</text><text x="65" y="510">Progetti</text><text x="65" y="585">Documenti</text><text x="65" y="660">Agenda</text><text x="65" y="735">Modelli e voci</text><text x="65" y="810">Impostazioni</text></g><rect x="38" y="546" width="230" height="58" rx="14" fill="#47191d"/><circle cx="246" cy="575" r="5" fill="#ff4545"/><text x="350" y="80" fill="#9a9ba1" font-family="monospace" font-size="20" letter-spacing="5">DOCUMENTI</text><text x="350" y="142" fill="#fff" font-family="Arial" font-size="42" font-weight="750">Scrivi, apri, analizza, esporta.</text><g font-family="Arial"><rect x="350" y="205" width="150" height="52" rx="12" fill="#4a4c54"/><text x="425" y="238" text-anchor="middle" fill="#fff" font-size="17">Apri file…</text><rect x="515" y="205" width="180" height="52" rx="12" fill="#4a4c54"/><text x="605" y="238" text-anchor="middle" fill="#fff" font-size="17">Nuovo documento</text><rect x="710" y="205" width="205" height="52" rx="12" fill="#ff3f3b"/><text x="812" y="238" text-anchor="middle" fill="#fff" font-size="17">Analizza nella chat</text><rect x="350" y="292" width="910" height="490" rx="18" fill="#17191f" stroke="#353741"/><text x="385" y="340" fill="#fff" font-size="24" font-weight="700">Progetto VOX</text><text x="385" y="392" fill="#b4b6bd" font-size="19">Questo editor conserva il testo sul Mac e permette di</text><text x="385" y="427" fill="#b4b6bd" font-size="19">preparare contenuti da analizzare nella conversazione.</text><text x="385" y="490" fill="#b4b6bd" font-size="19">• PDF e DOCX per i documenti</text><text x="385" y="527" fill="#b4b6bd" font-size="19">• XLSX per tabelle semplici</text><text x="385" y="564" fill="#b4b6bd" font-size="19">• TXT per il testo puro</text><text x="385" y="640" fill="#777a83" font-size="17">Il layout complesso e le formule non vengono conservati.</text><text x="1310" y="312" fill="#fff" font-size="22" font-weight="700">Esporta</text><g fill="#4a4c54"><rect x="1310" y="350" width="190" height="50" rx="12"/><rect x="1310" y="415" width="190" height="50" rx="12"/><rect x="1310" y="480" width="190" height="50" rx="12"/><rect x="1310" y="545" width="190" height="50" rx="12"/></g><g fill="#fff" font-size="17"><text x="1405" y="382" text-anchor="middle">PDF</text><text x="1405" y="447" text-anchor="middle">DOCX</text><text x="1405" y="512" text-anchor="middle">XLSX</text><text x="1405" y="577" text-anchor="middle">TXT</text></g><rect x="350" y="815" width="1150" height="78" rx="16" fill="#181a20"/><circle cx="385" cy="854" r="6" fill="#42d879"/><text x="410" y="861" fill="#aeb1b8" font-size="18">Documento locale · nessun caricamento automatico</text></g></svg>
