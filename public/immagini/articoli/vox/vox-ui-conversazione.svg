<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="t d"><title id="t">Schermata Conversazione di VOX</title><desc id="d">Ricostruzione fedele dell'interfaccia scura dell'app Retro di Testa VOX</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#07090e"/><stop offset="1" stop-color="#151820"/></linearGradient><filter id="r"><feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ff3838" flood-opacity=".32"/></filter></defs><rect width="1600" height="980" rx="36" fill="#222328"/><rect y="42" width="1600" height="938" rx="0 0 36 36" fill="url(#g)"/><path d="M305 42v938" stroke="#2b2d34"/><text x="55" y="110" fill="#96979e" font-family="monospace" font-size="22" letter-spacing="6">RETRO DI TESTA</text><text x="55" y="215" fill="white" font-family="Arial" font-size="82" font-weight="800" letter-spacing="14">VOX</text><text x="55" y="270" fill="#ff5151" font-family="monospace" font-size="17" letter-spacing="3">PERSONAL INTELLIGENCE</text><g fill="#fff" font-family="Arial" font-size="21"><text x="68" y="390">Conversazione</text><text x="68" y="465">Cronologia</text><text x="68" y="540">Progetti</text><text x="68" y="615">Documenti</text><text x="68" y="690">Agenda</text><text x="68" y="765">Modelli e voci</text><text x="68" y="840">Impostazioni</text></g><rect x="42" y="350" width="220" height="58" rx="15" fill="#49191d"/><circle cx="242" cy="379" r="5" fill="#ff4545"/><text x="350" y="105" fill="#9a9ba3" font-family="monospace" font-size="22" letter-spacing="5">CONVERSAZIONE</text><text x="350" y="165" fill="white" font-family="Arial" font-size="44" font-weight="750">La tua voce. Il tuo spazio.</text><g transform="translate(865 275)" filter="url(#r)"><circle cx="200" cy="190" r="170" fill="none" stroke="#ff3d3d" stroke-opacity=".15"/><circle cx="200" cy="190" r="116" fill="none" stroke="#ff3d3d" stroke-opacity=".4" stroke-width="3"/><path d="M30 190h340" stroke="#ff4444" stroke-width="4"/><circle cx="200" cy="190" r="12" fill="white"/><circle cx="200" cy="190" r="28" fill="none" stroke="#ff4444" stroke-width="4"/><path d="M40 315l24-18 25 35 28-71 29 52 34-106 33 126 34-88 34 56 30-38 31 46 35-78" fill="none" stroke="#e5e8ec" stroke-width="6" stroke-linecap="round"/></g><rect x="350" y="270" width="450" height="250" rx="22" fill="#181a20" stroke="#30323b"/><text x="385" y="330" fill="#bfc1c7" font-family="Arial" font-size="20">Benvenuto in VOX.</text><text x="385" y="377" fill="#8f9198" font-family="Arial" font-size="18">Avvia la chat testuale oppure apri</text><text x="385" y="408" fill="#8f9198" font-family="Arial" font-size="18">una sessione vocale. Il modello e le</text><text x="385" y="439" fill="#8f9198" font-family="Arial" font-size="18">conversazioni restano sul tuo Mac.</text><rect x="350" y="560" width="810" height="62" rx="14" fill="#202229" stroke="#3a3c44"/><text x="380" y="599" fill="#777a83" font-family="Arial" font-size="19">Scrivi a VOX…</text><rect x="350" y="660" width="215" height="62" rx="14" fill="#3c3e46"/><text x="457" y="699" text-anchor="middle" fill="white" font-family="Arial" font-size="20">Chat testuale</text><rect x="585" y="660" width="215" height="62" rx="14" fill="#ff3c38"/><text x="692" y="699" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="700">Parla con VOX</text><circle cx="63" cy="920" r="6" fill="#41db77"/><text x="84" y="927" fill="#41db77" font-family="monospace" font-size="17">ELABORAZIONE LOCALE</text><text x="1475" y="93" text-anchor="end" fill="#8f9198" font-family="monospace" font-size="18">24 OTT · 2026</text></svg>
