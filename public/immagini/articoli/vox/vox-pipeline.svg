<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline locale di Retro di Testa VOX</title><desc id="desc">La voce passa da Whisper a Dolphin e quindi alle voci Kokoro</desc>
  <defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#0b1726"/><stop offset="1" stop-color="#152d49"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#ff4b46"/></marker></defs>
  <rect width="1400" height="520" rx="32" fill="url(#b)"/>
  <text x="70" y="78" fill="#77d9ee" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">TUTTO SUL MAC</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 150)"><rect width="280" height="230" rx="26" fill="#f7f4ed"/><text x="140" y="86" text-anchor="middle" fill="#10213a" font-size="48">MIC</text><text x="140" y="135" text-anchor="middle" fill="#10213a" font-size="25" font-weight="700">La tua voce</text><text x="140" y="178" text-anchor="middle" fill="#667386" font-size="20">audio locale</text></g>
    <g transform="translate(410 150)"><rect width="280" height="230" rx="26" fill="#f7f4ed"/><text x="140" y="86" text-anchor="middle" fill="#ff3e39" font-size="43" font-weight="800">WHISPER</text><text x="140" y="135" text-anchor="middle" fill="#10213a" font-size="25" font-weight="700">Voce → testo</text><text x="140" y="178" text-anchor="middle" fill="#667386" font-size="20">italiano</text></g>
    <g transform="translate(750 150)"><rect width="280" height="230" rx="26" fill="#f7f4ed"/><text x="140" y="86" text-anchor="middle" fill="#ff3e39" font-size="43" font-weight="800">DOLPHIN</text><text x="140" y="135" text-anchor="middle" fill="#10213a" font-size="25" font-weight="700">Risposta locale</text><text x="140" y="178" text-anchor="middle" fill="#667386" font-size="20">8B · GGUF</text></g>
    <g transform="translate(1090 150)"><rect width="240" height="230" rx="26" fill="#f7f4ed"/><text x="120" y="86" text-anchor="middle" fill="#ff3e39" font-size="40" font-weight="800">KOKORO</text><text x="120" y="135" text-anchor="middle" fill="#10213a" font-size="25" font-weight="700">Testo → voce</text><text x="120" y="178" text-anchor="middle" fill="#667386" font-size="20">Sara · Nicola</text></g>
    <path d="M350 265h48M690 265h48M1030 265h48" stroke="#ff4b46" stroke-width="7" marker-end="url(#a)"/>
  </g>
  <text x="700" y="460" text-anchor="middle" fill="#b8c6d3" font-family="Arial, sans-serif" font-size="22">Nessun servizio cloud necessario per la conversazione dopo l’installazione dei componenti</text>
