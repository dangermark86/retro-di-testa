<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Schema corretto del collegamento della cassa Aurora MTM</title>
  <desc id="desc">Il segnale entra nel crossover. L'uscita alte frequenze alimenta il tweeter, mentre l'uscita bassi alimenta due altoparlanti da otto ohm collegati in parallelo, equivalenti a un ramo da quattro ohm.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1a2d"/><stop offset="1" stop-color="#142c4c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e63a3a"/></marker>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <text x="70" y="74" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">Aurora MTM · collegamento corretto</text>
  <text x="70" y="112" fill="#aebfd6" font-family="Arial,sans-serif" font-size="19">Due driver da 8 Ω in parallelo formano un ramo bassi/medi da 4 Ω.</text>

  <g filter="url(#shadow)">
    <rect x="65" y="268" width="210" height="210" rx="24" fill="#fff"/>
    <text x="170" y="337" text-anchor="middle" fill="#14243e" font-family="Arial,sans-serif" font-size="21" font-weight="700">AMPLIFICATORE</text>
    <circle cx="130" cy="402" r="18" fill="#df3434"/><circle cx="210" cy="402" r="18" fill="#172334"/>
    <text x="130" y="446" text-anchor="middle" fill="#df3434" font-family="Arial,sans-serif" font-size="26" font-weight="700">+</text>
    <text x="210" y="446" text-anchor="middle" fill="#172334" font-family="Arial,sans-serif" font-size="26" font-weight="700">−</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="205" width="280" height="335" rx="24" fill="#fff"/>
    <text x="530" y="257" text-anchor="middle" fill="#14243e" font-family="Arial,sans-serif" font-size="28" font-weight="700">CROSSOVER</text>
    <text x="530" y="288" text-anchor="middle" fill="#65758b" font-family="Arial,sans-serif" font-size="17">passivo a 2 vie</text>
    <rect x="430" y="325" width="200" height="55" rx="12" fill="#edf2fb"/><text x="530" y="360" text-anchor="middle" fill="#14243e" font-family="Arial,sans-serif" font-size="20" font-weight="700">IN + / −</text>
    <rect x="430" y="412" width="200" height="55" rx="12" fill="#fff0e8"/><text x="530" y="447" text-anchor="middle" fill="#a34516" font-family="Arial,sans-serif" font-size="20" font-weight="700">TREBLE + / −</text>
    <rect x="430" y="488" width="200" height="55" rx="12" fill="#e9f4ff"/><text x="530" y="523" text-anchor="middle" fill="#215fa3" font-family="Arial,sans-serif" font-size="20" font-weight="700">BASS + / −</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="155" width="335" height="145" rx="24" fill="#fff"/>
    <circle cx="855" cy="227" r="43" fill="#172334"/><circle cx="855" cy="227" r="22" fill="#d8a36a"/>
    <text x="925" y="214" fill="#14243e" font-family="Arial,sans-serif" font-size="24" font-weight="700">Tweeter</text>
    <text x="925" y="247" fill="#65758b" font-family="Arial,sans-serif" font-size="18">ramo alte frequenze</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="355" width="335" height="290" rx="24" fill="#fff"/>
    <circle cx="870" cy="445" r="58" fill="#172334"/><circle cx="870" cy="445" r="35" fill="#f4f1e8"/><circle cx="870" cy="445" r="14" fill="#c98652"/>
    <circle cx="870" cy="560" r="58" fill="#172334"/><circle cx="870" cy="560" r="35" fill="#f4f1e8"/><circle cx="870" cy="560" r="14" fill="#c98652"/>
    <text x="955" y="431" fill="#14243e" font-family="Arial,sans-serif" font-size="23" font-weight="700">Driver 1 · 8 Ω</text>
    <text x="955" y="546" fill="#14243e" font-family="Arial,sans-serif" font-size="23" font-weight="700">Driver 2 · 8 Ω</text>
    <rect x="930" y="580" width="160" height="42" rx="21" fill="#3159e8"/><text x="1010" y="608" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">PARALLELO = 4 Ω</text>
  </g>

  <path d="M275 373 H390" stroke="#e63a3a" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M670 440 C735 440 720 228 790 228" stroke="#e4972a" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M670 515 H740 V445 H790" stroke="#3159e8" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M740 515 V560 H790" stroke="#3159e8" stroke-width="7" fill="none" marker-end="url(#arrow)"/>

  <rect x="65" y="674" width="1060" height="46" rx="15" fill="#ffffff15"/>
  <text x="595" y="704" text-anchor="middle" fill="#d8e2ef" font-family="Arial,sans-serif" font-size="17">L'impedenza complessiva del diffusore varia con la frequenza: per conoscerne il minimo reale serve una misura.</text>
</svg>
